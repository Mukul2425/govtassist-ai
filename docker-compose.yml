services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: govtassist-postgres
    environment:
      POSTGRES_USER: govtassist
      POSTGRES_PASSWORD: govtassist
      POSTGRES_DB: govtassist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govtassist"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: govtassist-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: govtassist-backend
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m scripts.seed_data &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+asyncpg://govtassist:govtassist@postgres:5432/govtassist
      DATABASE_URL_SYNC: postgresql://govtassist:govtassist@postgres:5432/govtassist
      REDIS_URL: redis://redis:6379/0
      LLM_MOCK_MODE: "true"
      ADMIN_API_KEY: dev-admin-key
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: govtassist-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
